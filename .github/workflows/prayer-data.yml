name: Prayer data

# Scrapes MARA (this year and next, all cities) and publishes the feed to
# GitHub Pages (Settings -> Pages -> Source: GitHub Actions). The watch
# downloads a whole year at once, so a monthly refresh is plenty.
on:
  schedule:
    - cron: "0 20 1 * *" # 1st of each month, midnight Oman time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python server/build_site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
